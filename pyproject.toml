[project]
name = "uae-retail-demand-forecasting"
version = "1.0.0"
description = "Store x product demand forecasting with UAE seasonality, replenishment and promotion analytics"
authors = [{ name = "Vineetha Susan Alexander" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
